telemetry:
  enabled: false

run_storage:
  module: dagster._core.storage.runs
  class: SqliteRunStorage
  config:
    base_dir: .dagster_home/history

event_log_storage:
  module: dagster._core.storage.event_log
  class: SqliteEventLogStorage
  config:
    base_dir: .dagster_home/history

schedule_storage:
  module: dagster._core.storage.schedules
  class: SqliteScheduleStorage
  config:
    base_dir: .dagster_home/history

scheduler:
  module: dagster._core.scheduler
  class: DagsterDaemonScheduler

# Without this, a hung run (e.g. a stalled network read during ingestion)
# occupies this laptop's one execution slot indefinitely -- nothing else
# scheduled/sensor-triggered can make progress until a human notices and
# manually terminates it. Enforced by the daemon, which `dagster dev`
# already runs.
run_monitoring:
  enabled: true
  max_runtime_seconds: 1800
  poll_interval_seconds: 60
