[project]
name = "fraud-detection01"
version = "0.1.0"
description = "IEEE-CIS fraud features ML pipeline."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "dagster>=1.13.16",
    "dagster-webserver>=1.13.16",
    "fastapi>=0.141.1",
    "google-cloud-aiplatform>=1.130.0",
    "google-cloud-bigquery>=3.42.3",
    "google-cloud-bigquery-storage>=2.28.0",
    "db-dtypes>=1.4.0",
    "google-cloud-storage>=3.13.1",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.1",
    "kagglehub>=1.0.2",
    "joblib>=1.3",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "polars>=1.43.2",
    "plotly>=6.9.0",
    # Plotly's static export backend. Required at training time, not only in a
    # notebook: the figures are written as PNG into the run's artifact directory.
    "kaleido>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.optional-dependencies]
data = ["kagglehub>=0.3"]

[project.scripts]
score-batch = "fraud_detection.serving.batch:main"
stamp-contract = "fraud_detection.contract.stamp:main"
export-audit-frame = "fraud_detection.contract.export_frame:main"
noise-band = "fraud_detection.tools.noise_band:main"
build-frequency-maps = "fraud_detection.tools.frequency_maps:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
