[training]
min_test_pr_auc = 0.50
reference_test_pr_auc = 0.5237
train_fraction = 0.75
val_start_fraction = 0.85
val_end_fraction = 0.90

[training.lightgbm]
objective = "binary"
metric = "average_precision"
learning_rate = 0.05
num_leaves = 64
min_child_samples = 100
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
verbosity = -1
seed = 42
deterministic = true
force_row_wise = true
num_threads = 8
feature_pre_filter = false
num_boost_round = 2000
early_stopping_rounds = 50
search_iter = 10

[training.lightgbm_search_space]
num_leaves = [80, 96, 112]
learning_rate = [0.05]
feature_fraction = [0.5, 0.6, 0.7]
bagging_fraction = [0.7, 0.8, 0.9]
min_child_samples = [80, 100, 120]

[training.threshold]
default_false_positive_budget = 0.01
default_false_positive_cost = 5.0

[training.calibration]
# A calibrator relabels scores; it must not reorder them. Isotonic is a step function and
# the ties it creates are ranking thrown away -- on 2026-08-16 it won the log-loss
# comparison by 0.0007 and cost 0.0211 PR-AUC doing it. Any method giving up more than this
# much cross-validated PR-AUC against the raw scores is disqualified regardless of how well
# it calibrates. 0.005 is roughly the run-to-run noise band, so the budget says "a
# calibrator may cost less than the noise, not more".
max_pr_auc_loss = 0.005

[training.bqml]
baseline_model = "baseline_logreg"
baseline_metrics_path = "baseline/metrics.json"
vertex_baseline_model_id = "fraud-bqml-baseline"

[training.plots]
figsize = [6.5, 5.0]
dpi = 120
