## ---- frequency encoding ----
##
## One integer per column regardless of cardinality: how often this value occurs in the
## training split. This is a *fitted* transform, so its parameters are committed --
## references/frequency-maps.json, built by `uv run build-frequency-maps`, fitted on the
## 442,905 training rows and nothing else. Counting the frame in hand would give training
## and scoring two different mappings; counting train and test together would be
## transductive, which is the shortcut docs/adversarial-drift.md and point-in-time.md both
## exist to forbid. The published kernels do count over both -- legitimate in a
## competition, unavailable to a system scoring a period nobody has seen.
##
## Values below min_count (2) are absent from the map and encode as null. A count of 1 is
## not a frequency, it is a fingerprint of one transaction.
##
## Five columns, chosen on evidence rather than on cardinality. The question frequency
## encoding answers is "does rarity itself predict fraud here", and it does not for every
## high-cardinality column. Fraud rate by frequency band, against a 0.0350 base:
##
##   id_31          6.77x / 4.14x / 2.96x / 2.17x   monotone, strongest
##   DeviceInfo     2.22x / 4.29x / 3.57x / 1.54x   strong
##   addr1          0.70x / 2.55x / 1.83x / 0.69x   a hump, but a real one
##   R_emaildomain  3.36x / 1.24x / 0.89x / 2.44x   U-shaped; both tails carry it
##   P_emaildomain     -  / 2.05x / 1.08x / 1.03x   mild, monotone
##
## card1 (0.85 / 0.76 / 1.19 / 0.98) and card2 (- / 0.37 / 1.07 / 0.99) were declared here
## first and removed: their frequency is portfolio size, not risk. They were picked by
## cardinality, which is the same "chosen by assumption" mistake the noise-band entry in
## MEASUREMENTS.md catches elsewhere. card1 alone was 9,146 levels of committed map.

[[derive]]
name = "addr1_freq"
tool = "frequency_encode"
inputs = ["addr1"]

[[derive]]
name = "P_emaildomain_freq"
tool = "frequency_encode"
inputs = ["P_emaildomain"]

[[derive]]
name = "R_emaildomain_freq"
tool = "frequency_encode"
inputs = ["R_emaildomain"]

[[derive]]
name = "DeviceInfo_freq"
tool = "frequency_encode"
inputs = ["DeviceInfo"]

[[derive]]
name = "id_31_freq"
tool = "frequency_encode"
inputs = ["id_31"]
