name: CI

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  quality:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff
        run: uv run ruff check .

      # Plain `pytest`. This used to swallow exit code 5 -- "no tests collected" -- from a
      # time when there were none. There are 290, and a run that suddenly collects zero is
      # now the most alarming thing this workflow could see, not something to wave through.
      - name: Run pytest
        run: uv run pytest

      # The contract is committed, and so are the audit fragments it was stamped
      # from. This re-stamps into memory and compares fingerprints, so a pull
      # request that changes an audit without re-stamping fails here rather than
      # shipping a contract that describes an older table. It needs neither R nor
      # the dataset -- only the two committed artefacts -- which is why it lives
      # in this job and costs nothing.
      - name: Check the feature contract is current
        run: uv run stamp-contract --check

      # Audits the dependency set the *image* ships, which is the one an attacker can
      # reach: `--no-dev` because pytest and ruff never leave CI. Blocking on purpose. If a
      # finding is triaged as not-applicable, add `--ignore-vuln <ID>` here with a comment
      # saying who decided and why -- an advisory waved through silently is the same
      # failure mode as a gate check that cannot fail.
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev > requirements.audit.txt
          uvx pip-audit --requirement requirements.audit.txt --strict

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v2

      - name: Run tofu validate
        run: |
          cd iaac
          tofu init -backend=false
          tofu validate

      - name: Run dagster definitions validate (Feature Platform)
        run: uv run dagster definitions validate -m fraud_detection.orchestration.definitions.feature_platform
        env:
          GCP_PROJECT_ID: "mock-project-id"

      - name: Run dagster definitions validate (Model Factory)
        run: uv run dagster definitions validate -m fraud_detection.orchestration.definitions.model_factory
        env:
          GCP_PROJECT_ID: "mock-project-id"

      - name: Run dagster definitions validate (Inference)
        run: uv run dagster definitions validate -m fraud_detection.orchestration.definitions.inference
        env:
          GCP_PROJECT_ID: "mock-project-id"

      # The image is what the Cloud Run Job actually runs, so a PR that breaks the build
      # should fail here rather than at the next deploy. Built, not pushed: pushing from a
      # pull request would put unreviewed code in the registry the job pulls from.
      - name: Build the scoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Into the local daemon rather than discarded, because the two steps below have
          # to scan the artifact this build produced. Scanning a rebuild would be scanning
          # a different thing and calling it the same.
          load: true
          tags: fraud-detection:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # IaC misconfiguration -- Terraform, the Dockerfile. Unchanged; it was here first.
      - name: Scan the infrastructure definitions
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # The other half, and the half that was missing: `scan-type: config` reads the
      # Dockerfile's *instructions* and never looks at what the build actually produced.
      # This scans the layers -- the OS packages from the base image and every wheel uv
      # installed. `ignore-unfixed` because a finding with no available fix is not an
      # action, and a gate that cannot be satisfied gets disabled within a month.
      - name: Scan the built image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: fraud-detection:${{ github.sha }}
          scanners: 'vuln,secret'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # An SBOM answers a question the scans cannot: months later, when an advisory lands
      # for some transitive package, which shipped images contained it? That has to be
      # answerable from a record made at build time, because the image is immutable and
      # nobody will rebuild forty tags to find out.
      - name: Generate the SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: fraud-detection:${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'

      - name: Publish the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # The audits are R, and they are a separate toolchain on purpose: they depend on
  # nothing in the Python environment, and Python depends on nothing here beyond one
  # stamped JSON file. Running them as their own job keeps that true -- a failure
  # names which half broke.
  #
  # No data, no credentials, no warehouse. Every test in analysis/ is synthetic, which
  # is what lets the statistics be checked on a pull request instead of only on a
  # machine that has the dataset.
  audits:
    name: Feature audits (R)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The R version is pinned to the one in renv.lock. A lockfile records package
      # versions and not the interpreter they were resolved against, so leaving this
      # floating would let a new R release change results while the lockfile still
      # claimed reproducibility.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      # `use-public-rspm` above and this override are the same decision seen from two
      # sides: renv.lock records CRAN as its repository, which serves source tarballs,
      # and building Hmisc, arrow and DescTools from source takes half an hour. P3M
      # serves the same versions as Linux binaries. The lockfile still decides *which*
      # versions; this only changes where they are fetched from.
      - name: Restore the R library
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: analysis
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

      - name: Run testthat
        run: Rscript tests/run.R

      # Loads `_targets.R` and reports what the graph would run without running it.
      # Catches the failure a test suite cannot see: a target that references a
      # function that no longer exists, or a policy key renamed on one side only.
      - name: Validate the audit graph
        run: Rscript -e 'targets::tar_manifest()'

